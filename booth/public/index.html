<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>助成金マッチングアプリ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ===== STEP 0: Welcome ===== -->
    <section id="step-0" class="step active">
      <div class="welcome">
        <div class="welcome__logo">💰</div>
        <h1 class="welcome__title">助成金・補助金<br />かんたん診断</h1>
        <p class="welcome__sub">
          貴社の課題に合った<br />助成金・補助金をAIが提案します
        </p>
        <button class="btn btn--primary btn--large" data-next="1">
          はじめる
        </button>
        <p class="welcome__note">所要時間：約1分</p>
      </div>
    </section>

    <!-- ===== STEP 1: Challenge Selection ===== -->
    <section id="step-1" class="step">
      <div class="step__inner">
        <div class="step__header">
          <span class="step__num">STEP 1 / 2</span>
          <h2 class="step__title">解決したい課題を選んでください</h2>
          <p class="step__hint">複数選択できます（1〜3つ）</p>
        </div>

        <div class="challenges">
          <button
            class="challenge-btn"
            data-value="dx_automation"
            data-icon="🤖"
          >
            <span class="challenge-btn__icon">🤖</span>
            <span class="challenge-btn__label">人手不足・<br />業務の自動化</span>
          </button>
          <button
            class="challenge-btn"
            data-value="skill_training"
            data-icon="📚"
          >
            <span class="challenge-btn__icon">📚</span>
            <span class="challenge-btn__label">社員の育成・<br />スキルアップ</span>
          </button>
          <button
            class="challenge-btn"
            data-value="hiring"
            data-icon="👥"
          >
            <span class="challenge-btn__icon">👥</span>
            <span class="challenge-btn__label">採用・<br />雇用の改善</span>
          </button>
          <button
            class="challenge-btn"
            data-value="workstyle"
            data-icon="⏰"
          >
            <span class="challenge-btn__icon">⏰</span>
            <span class="challenge-btn__label">働き方改革・<br />残業削減</span>
          </button>
          <button
            class="challenge-btn"
            data-value="sales_expansion"
            data-icon="🌐"
          >
            <span class="challenge-btn__icon">🌐</span>
            <span class="challenge-btn__label">新規顧客開拓・<br />販路拡大</span>
          </button>
          <button
            class="challenge-btn"
            data-value="digitalization"
            data-icon="💻"
          >
            <span class="challenge-btn__icon">💻</span>
            <span class="challenge-btn__label">デジタル化・<br />DX推進</span>
          </button>
        </div>

        <div class="step__footer">
          <button class="btn btn--ghost" data-prev="0">戻る</button>
          <button class="btn btn--primary" id="to-step-2" disabled>
            次へ →
          </button>
        </div>
      </div>
    </section>

    <!-- ===== STEP 2: Company Size ===== -->
    <section id="step-2" class="step">
      <div class="step__inner">
        <div class="step__header">
          <span class="step__num">STEP 2 / 2</span>
          <h2 class="step__title">会社の規模を教えてください</h2>
        </div>

        <div class="sizes">
          <button class="size-btn" data-value="small">
            <span class="size-btn__icon">🏪</span>
            <span class="size-btn__name">小規模事業者</span>
            <span class="size-btn__desc">従業員 20名以下</span>
          </button>
          <button class="size-btn" data-value="medium">
            <span class="size-btn__icon">🏢</span>
            <span class="size-btn__name">中小企業</span>
            <span class="size-btn__desc">従業員 21〜300名</span>
          </button>
          <button class="size-btn" data-value="large">
            <span class="size-btn__icon">🏬</span>
            <span class="size-btn__name">中堅・大企業</span>
            <span class="size-btn__desc">従業員 301名以上</span>
          </button>
        </div>

        <div class="step__footer">
          <button class="btn btn--ghost" data-prev="1">戻る</button>
        </div>
      </div>
    </section>

    <!-- ===== STEP 3: Loading ===== -->
    <section id="step-3" class="step">
      <div class="loading">
        <div class="loading__spinner"></div>
        <p class="loading__text">AIが助成金を分析中…</p>
        <div class="loading__steps">
          <div class="loading__step" id="l-step-1">
            <span class="loading__dot"></span>データベースを検索中
          </div>
          <div class="loading__step" id="l-step-2">
            <span class="loading__dot"></span>条件をマッチング中
          </div>
          <div class="loading__step" id="l-step-3">
            <span class="loading__dot"></span>活用プランを生成中
          </div>
        </div>
      </div>
    </section>

    <!-- ===== STEP 4: Results ===== -->
    <section id="step-4" class="step">
      <div class="results__container">
        <div class="results__header">
          <h2 class="results__title">診断結果</h2>
          <div class="results__tags" id="results-tags"></div>
        </div>

        <div class="results__body">
          <!-- Subsidy cards -->
          <div class="results__section">
            <h3 class="results__section-title">
              <span>💰</span> マッチした助成金・補助金
            </h3>
            <div class="subsidy-cards" id="subsidy-cards">
              <p class="results__empty">マッチする助成金を検索中…</p>
            </div>
          </div>

          <!-- AI proposal -->
          <div class="results__section">
            <h3 class="results__section-title">
              <span>🤖</span> AI活用提案
            </h3>
            <div class="proposal-box" id="proposal-box">
              <div class="proposal-loading">
                <span class="proposal-cursor"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="results__footer">
          <button class="btn btn--ghost" id="restart-btn">もう一度診断する</button>
          <button class="btn btn--primary" id="contact-btn">
            詳しく相談する
          </button>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
